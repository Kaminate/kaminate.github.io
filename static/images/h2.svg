<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 150"
     fill="none"
     stroke="black"
     stroke-width="2.4"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <!-- Reusable pointed leaf -->
    <path id="leaf"
          d="M0 0
             C-8 -11 -9 -26 0 -34
             C9 -26 8 -11 0 0Z"/>

    <!-- Small flower -->
    <g id="flower">
      <path d="M0 -6
               C-15 -27 15 -27 0 -6"/>
      <path d="M0 -6
               C-15 -27 15 -27 0 -6"
            transform="rotate(60)"/>
      <path d="M0 -6
               C-15 -27 15 -27 0 -6"
            transform="rotate(120)"/>
      <path d="M0 -6
               C-15 -27 15 -27 0 -6"
            transform="rotate(180)"/>
      <path d="M0 -6
               C-15 -27 15 -27 0 -6"
            transform="rotate(240)"/>
      <path d="M0 -6
               C-15 -27 15 -27 0 -6"
            transform="rotate(300)"/>
      <circle r="5"/>
      <circle r="1.5" fill="black" stroke="none"/>
    </g>
  </defs>

  <!-- Sweeping main stem -->
  <path d="M12 48
           C68 27 120 115 211 100
           C255 93 291 67 345 78"/>

  <!-- Companion stem -->
  <path d="M28 47
           C95 51 130 132 220 113
           C265 103 298 78 345 78"/>

  <!-- Alternating leaves -->
  <use href="#leaf" transform="translate(48 48) rotate(-58)"/>
  <use href="#leaf" transform="translate(76 59) rotate(-25)"/>
  <use href="#leaf" transform="translate(91 70) rotate(-115)"/>
  <use href="#leaf" transform="translate(115 84) rotate(-20)"/>
  <use href="#leaf" transform="translate(139 96) rotate(-130)"/>
  <use href="#leaf" transform="translate(159 102) rotate(-25)"/>
  <use href="#leaf" transform="translate(189 103) rotate(-145)"/>
  <use href="#leaf" transform="translate(220 98) rotate(25)"/>
  <use href="#leaf" transform="translate(253 86) rotate(-155)"/>
  <use href="#leaf" transform="translate(285 77) rotate(40)"/>
  <use href="#leaf" transform="translate(318 75) rotate(-160)"/>

  <!-- Upper curling branch -->
  <path d="M137 95
           C112 64 128 24 160 25
           C189 26 190 58 170 61
           C153 64 147 44 160 41
           C167 39 172 45 168 49"/>

  <use href="#leaf"
       transform="translate(129 58) rotate(-65) scale(.65)"/>

  <!-- Lower spiral -->
  <path d="M213 101
           C237 128 274 135 287 116
           C299 98 278 88 268 101
           C259 113 275 122 280 111"/>

  <!-- Inner tip scroll -->
  <path d="M294 78
           C316 54 345 49 347 65
           C349 77 331 80 329 69"/>

  <!-- Outer tip scroll -->
  <path d="M38 46
           C18 27 5 30 8 43
           C10 52 22 53 24 44"/>

  <!-- Main flower stalk -->
  <path d="M255 86 Q275 64 283 39"/>

  <!-- Main flower -->
  <use href="#flower"
       transform="translate(285 28) scale(1.05)"/>

  <!-- Smaller flower and stalk -->
  <path d="M92 71 Q83 48 92 31"/>
  <use href="#flower"
       transform="translate(94 23) scale(.62)"/>

  <!-- Bud branch -->
  <path d="M198 101 Q197 72 217 58"/>
  <path d="M217 58
           C200 48 208 34 218 43
           C230 35 235 52 217 58Z"/>
  <path d="M217 58 L218 44"/>

  <!-- Berry branch -->
  <path d="M57 51 Q42 76 30 82"/>
  <path d="M42 69 L27 67"/>
  <path d="M37 76 L42 89"/>
  <circle cx="23" cy="66" r="4"/>
  <circle cx="27" cy="84" r="4.5"/>
  <circle cx="43" cy="94" r="3.5"/>

  <!-- Dangling beads -->
  <path d="M171 118 Q169 126 173 132"/>
  <circle cx="174" cy="137" r="3.5"/>

  <path d="M153 115 L151 126"/>
  <circle cx="150" cy="130" r="2.5"/>

  <!-- Floating seed accents -->
  <g fill="black" stroke="none">
    <circle cx="113" cy="28" r="2"/>
    <circle cx="120" cy="18" r="1.4"/>
    <circle cx="241" cy="37" r="2"/>
    <circle cx="247" cy="28" r="1.4"/>
    <circle cx="311" cy="118" r="2"/>
    <circle cx="320" cy="112" r="1.4"/>
  </g>
</svg>