<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 220 100"
     fill="none"
     stroke="black"
     stroke-width="2.4"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <path id="leaf"
          d="M0 0
             C-8 -11 -9 -26 0 -34
             C9 -26 8 -11 0 0Z"/>
  </defs>

  <!-- Sweeping stem -->
  <path d="M12 30
           C54 24 97 80 153 70
           C174 66 190 57 208 59"/>

  <!-- Alternating leaves -->
  <use href="#leaf"
       transform="translate(43 35) rotate(-60) scale(.85)"/>
  <use href="#leaf"
       transform="translate(70 49) rotate(-25) scale(.85)"/>
  <use href="#leaf"
       transform="translate(85 59) rotate(-120) scale(.85)"/>
  <use href="#leaf"
       transform="translate(111 69) rotate(-15) scale(.8)"/>
  <use href="#leaf"
       transform="translate(139 72) rotate(-145) scale(.8)"/>
  <use href="#leaf"
       transform="translate(177 63) rotate(-150) scale(.65)"/>

  <!-- Lower curling tendril -->
  <path d="M123 71
           C144 94 174 95 179 81
           C183 69 167 65 163 76
           C161 82 168 85 172 80"/>

  <!-- Flower stalk -->
  <path d="M159 69 Q169 52 176 36"/>

  <!-- Five-petalled flower -->
  <g transform="translate(178 25)">
    <path d="M0 -4
             C-11 -20 11 -20 0 -4"/>
    <path d="M0 -4
             C-11 -20 11 -20 0 -4"
          transform="rotate(72)"/>
    <path d="M0 -4
             C-11 -20 11 -20 0 -4"
          transform="rotate(144)"/>
    <path d="M0 -4
             C-11 -20 11 -20 0 -4"
          transform="rotate(216)"/>
    <path d="M0 -4
             C-11 -20 11 -20 0 -4"
          transform="rotate(288)"/>
    <circle r="3.2"/>
  </g>
</svg>