<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 80"
     fill="none"
     stroke="black"
     stroke-width="2.4"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <path id="leaf"
          d="M0 0
             C-8 -11 -9 -26 0 -34
             C9 -26 8 -11 0 0Z"/>
  </defs>

  <!-- Curved stem -->
  <path d="M12 25
           C44 22 78 61 119 52
           Q135 48 150 49"/>

  <!-- Alternating leaves -->
  <use href="#leaf"
       transform="translate(40 30) rotate(-55) scale(.7)"/>
  <use href="#leaf"
       transform="translate(65 42) rotate(-20) scale(.7)"/>
  <use href="#leaf"
       transform="translate(81 50) rotate(-125) scale(.7)"/>
  <use href="#leaf"
       transform="translate(106 54) rotate(-150) scale(.6)"/>

  <!-- Small curling tendril -->
  <path d="M99 54
           C113 72 137 72 140 61
           C143 51 130 49 128 57
           C127 61 131 63 134 60"/>

  <!-- Bud stalk -->
  <path d="M121 51 Q129 38 130 29"/>

  <!-- Closed bud -->
  <path d="M130 29
           C116 24 119 12 128 17
           C136 8 145 19 130 29Z"/>
  <path d="M130 29 Q132 22 128 17"/>
</svg>